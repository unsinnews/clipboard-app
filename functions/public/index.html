<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时在线剪贴板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
            text-align: center;
        }

        .status {
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .status.connected {
            color: #10b981;
        }

        .status.disconnected {
            color: #ef4444;
        }

        .status.connecting {
            color: #f59e0b;
        }

        .status::before {
            content: '●';
            margin-right: 5px;
            font-size: 16px;
        }

        textarea {
            width: 100%;
            min-height: 300px;
            padding: 20px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: #f3f4f6;
            border-radius: 10px;
            font-size: 14px;
            color: #6b7280;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #6b7280;
            margin-top: 5px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-copy {
            background: #667eea;
            color: white;
        }

        .btn-copy:hover {
            background: #5568d3;
        }

        .btn-clear {
            background: #ef4444;
            color: white;
        }

        .btn-clear:hover {
            background: #dc2626;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            opacity: 0;
            transform: translateY(100px);
            transition: all 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 实时在线剪贴板</h1>
        <div id="status" class="status connecting">正在连接...</div>
        
        <textarea 
            id="clipboard" 
            placeholder="在这里输入或粘贴内容，所有设备会实时同步..."
        ></textarea>

        <div class="buttons">
            <button class="btn-copy" onclick="copyToClipboard()">📄 复制内容</button>
            <button class="btn-clear" onclick="clearClipboard()">🗑️ 清空</button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="charCount">0</div>
                <div class="stat-label">字符数</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="wordCount">0</div>
                <div class="stat-label">单词数</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="lastUpdate">--</div>
                <div class="stat-label">最后更新</div>
            </div>
        </div>

        <div class="info">
            💡 <strong>使用提示：</strong> 
            在任何设备上打开此页面，内容会自动实时同步。可用于跨设备传输文本、临时保存代码片段等。
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let ws;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;
        let isUpdating = false;

        const textarea = document.getElementById('clipboard');
        const statusEl = document.getElementById('status');
        const charCountEl = document.getElementById('charCount');
        const wordCountEl = document.getElementById('wordCount');
        const lastUpdateEl = document.getElementById('lastUpdate');

        // WebSocket 连接
        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('WebSocket 连接已建立');
                updateStatus('connected', '已连接');
                reconnectAttempts = 0;
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'init' || data.type === 'update') {
                        isUpdating = true;
                        textarea.value = data.content || '';
                        updateStats();
                        updateLastUpdateTime(data.timestamp);
                        isUpdating = false;
                    }
                } catch (err) {
                    console.error('解析消息错误:', err);
                }
            };

            ws.onclose = () => {
                console.log('WebSocket 连接已关闭');
                updateStatus('disconnected', '连接断开');
                attemptReconnect();
            };

            ws.onerror = (error) => {
                console.error('WebSocket 错误:', error);
                updateStatus('disconnected', '连接错误');
            };
        }

        // 重连机制
        function attemptReconnect() {
            if (reconnectAttempts < maxReconnectAttempts) {
                reconnectAttempts++;
                updateStatus('connecting', `重连中 (${reconnectAttempts}/${maxReconnectAttempts})...`);
                setTimeout(connect, 2000 * reconnectAttempts);
            } else {
                updateStatus('disconnected', '连接失败，请刷新页面');
            }
        }

        // 更新状态
        function updateStatus(status, text) {
            statusEl.className = `status ${status}`;
            statusEl.textContent = text;
        }

        // 文本框输入事件
        let debounceTimer;
        textarea.addEventListener('input', () => {
            if (isUpdating) return;

            updateStats();
            
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'update',
                        content: textarea.value
                    }));
                }
            }, 300);
        });

        // 更新统计信息
        function updateStats() {
            const text = textarea.value;
            charCountEl.textContent = text.length;
            wordCountEl.textContent = text.trim() ? text.trim().split(/\s+/).length : 0;
        }

        // 更新最后更新时间
        function updateLastUpdateTime(timestamp) {
            const now = new Date(timestamp);
            lastUpdateEl.textContent = now.toLocaleTimeString('zh-CN');
        }

        // 复制到剪贴板
        async function copyToClipboard() {
            try {
                await navigator.clipboard.writeText(textarea.value);
                showToast('✅ 已复制到剪贴板');
            } catch (err) {
                textarea.select();
                document.execCommand('copy');
                showToast('✅ 已复制到剪贴板');
            }
        }

        // 清空内容
        function clearClipboard() {
            if (confirm('确定要清空剪贴板内容吗？')) {
                textarea.value = '';
                updateStats();
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'update',
                        content: ''
                    }));
                }
                showToast('🗑️ 已清空');
            }
        }

        // 显示提示信息
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 页面加载时连接
        connect();
    </script>
</body>
</html>
